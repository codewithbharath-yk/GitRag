<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <radialGradient id="hlLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#1F3B2C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F1E3D3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left Mascot Group for Light Surfaces -->
  <g transform="translate(15, 8)">
    <circle cx="62" cy="62" r="56" fill="url(#hlLight)" />
    <circle cx="62" cy="54" r="42" fill="none" stroke="#D4A373" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.8" />

    <!-- Cat Ears -->
    <path d="M44 48 L36 30 C43 32 50 38 52 44 Z" fill="#1F3B2C" stroke="#D4A373" stroke-width="2" stroke-linejoin="round" />
    <path d="M80 48 L88 30 C81 32 74 38 72 44 Z" fill="#1F3B2C" stroke="#D4A373" stroke-width="2" stroke-linejoin="round" />

    <!-- Head Shell -->
    <ellipse cx="62" cy="54" rx="25" ry="21" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.2" />
    <!-- Faceplate -->
    <ellipse cx="62" cy="56" rx="18" ry="13" fill="#F1E3D3" />

    <!-- Eyes -->
    <path d="M52 54 Q56 49 60 54" fill="none" stroke="#1F3B2C" stroke-width="2.2" stroke-linecap="round" />
    <path d="M64 54 Q68 49 72 54" fill="none" stroke="#1F3B2C" stroke-width="2.2" stroke-linecap="round" />

    <!-- Antenna -->
    <path d="M72 38 L79 26" stroke="#D4A373" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="80" cy="24" r="3" fill="#D4A373" stroke="#1F3B2C" stroke-width="1" />

    <!-- Laptop with Code -->
    <path d="M51 76 L83 76 L76 96 L44 96 Z" fill="#1F3B2C" stroke="#D4A373" stroke-width="2" stroke-linejoin="round" />
    <polygon points="53,78 81,78 75,94 47,94" fill="#15281E" />
    <path d="M57 84 L54 87 L57 90" fill="none" stroke="#F1E3D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="64" y1="83" x2="61" y2="91" stroke="#D4A373" stroke-width="1.6" stroke-linecap="round" />
    <path d="M67 84 L70 87 L67 90" fill="none" stroke="#F1E3D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography Right (Emerald Night Wordmark with Gold Accent) -->
  <text x="145" y="78" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="-1.5">
    <tspan fill="#1F3B2C">Code</tspan><tspan fill="#D4A373">RAG</tspan>
  </text>
  <text x="148" y="106" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" letter-spacing="4.5" fill="#1F3B2C" opacity="0.85">
    GITHUB CODEBASE AI ASSISTANT
  </text>
</svg>
