<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Squircle Base in Emerald Night -->
  <rect width="64" height="64" rx="16" fill="#1F3B2C" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#D4A373" stroke-width="1.5" />

  <!-- Orbit Ring -->
  <circle cx="32" cy="28" r="22" fill="none" stroke="#D4A373" stroke-width="1" stroke-dasharray="3 2" opacity="0.6" />

  <!-- Ears -->
  <path d="M21 24 L16 12 C21 14 26 19 27 23 Z" fill="#15281E" stroke="#D4A373" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M43 24 L48 12 C43 14 38 19 37 23 Z" fill="#15281E" stroke="#D4A373" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Head -->
  <ellipse cx="32" cy="27" rx="14" ry="11" fill="#1F3B2C" stroke="#D4A373" stroke-width="1.8" />
  <ellipse cx="32" cy="28" rx="9" ry="6.5" fill="#F1E3D3" />

  <!-- Eyes -->
  <path d="M27 28 Q29 24 31 28" fill="none" stroke="#1F3B2C" stroke-width="1.8" stroke-linecap="round" />
  <path d="M33 28 Q35 24 37 28" fill="none" stroke="#1F3B2C" stroke-width="1.8" stroke-linecap="round" />

  <!-- Antenna with Gold Orb -->
  <path d="M37 17 L42 9" stroke="#D4A373" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="43" cy="8" r="2.2" fill="#D4A373" stroke="#F1E3D3" stroke-width="0.8" />

  <!-- Laptop with Code -->
  <path d="M23 40 L43 40 L39 54 L19 54 Z" fill="#15281E" stroke="#D4A373" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="24,41 42,41 38,53 20,53" fill="#1F3B2C" />
  <path d="M27 45 L25 47 L27 49" fill="none" stroke="#F1E3D3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="32" y1="44" x2="30" y2="50" stroke="#D4A373" stroke-width="1.2" stroke-linecap="round" />
  <path d="M35 45 L37 47 L35 49" fill="none" stroke="#F1E3D3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>