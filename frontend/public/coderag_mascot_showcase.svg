<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Emerald Night -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15281E" />
      <stop offset="50%" stop-color="#1F3B2C" />
      <stop offset="100%" stop-color="#0E1A14" />
    </linearGradient>

    <!-- Ambient Gold Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#1F3B2C" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1F3B2C" stop-opacity="0" />
    </radialGradient>

    <!-- Circuit Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4A373" stroke-width="0.75" stroke-opacity="0.15" />
      <circle cx="40" cy="40" r="1.5" fill="#D4A373" fill-opacity="0.25" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#284E3B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1F3B2C" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Center Ambient Halo -->
  <circle cx="400" cy="225" r="240" fill="url(#centerGlow)" />

  <!-- Background Floating Code Panels -->
  <!-- Left Code Window -->
  <g transform="translate(60, 80)" opacity="0.85">
    <rect width="210" height="150" rx="14" fill="url(#cardGrad)" stroke="#D4A373" stroke-width="1.2" stroke-opacity="0.4" />
    <!-- Window Dots -->
    <circle cx="22" cy="18" r="4" fill="#D4A373" />
    <circle cx="34" cy="18" r="4" fill="#F1E3D3" opacity="0.6" />
    <circle cx="46" cy="18" r="4" fill="#1F3B2C" stroke="#D4A373" stroke-width="1" />
    <!-- Syntax Lines -->
    <rect x="20" y="38" width="60" height="6" rx="3" fill="#D4A373" />
    <rect x="86" y="38" width="90" height="6" rx="3" fill="#F1E3D3" opacity="0.8" />
    <rect x="30" y="54" width="110" height="6" rx="3" fill="#F1E3D3" opacity="0.6" />
    <rect x="30" y="70" width="75" height="6" rx="3" fill="#D4A373" opacity="0.7" />
    <rect x="30" y="86" width="130" height="6" rx="3" fill="#F1E3D3" opacity="0.5" />
    <rect x="20" y="104" width="40" height="6" rx="3" fill="#D4A373" />
    <!-- Grounded Line Reference Pill -->
    <rect x="20" y="122" width="125" height="18" rx="6" fill="#15281E" stroke="#D4A373" stroke-width="1" />
    <text x="28" y="135" fill="#D4A373" font-family="monospace" font-size="9" font-weight="bold">rag_service.py:L42-89</text>
  </g>

  <!-- Right Knowledge Graph / RAG Metrics Window -->
  <g transform="translate(530, 210)" opacity="0.85">
    <rect width="210" height="160" rx="14" fill="url(#cardGrad)" stroke="#D4A373" stroke-width="1.2" stroke-opacity="0.4" />
    <!-- Window Dots -->
    <circle cx="22" cy="18" r="4" fill="#D4A373" />
    <circle cx="34" cy="18" r="4" fill="#F1E3D3" opacity="0.6" />
    <circle cx="46" cy="18" r="4" fill="#1F3B2C" stroke="#D4A373" stroke-width="1" />
    <!-- Metric Pills -->
    <rect x="20" y="38" width="170" height="24" rx="6" fill="#15281E" stroke="#D4A373" stroke-width="0.8" />
    <text x="28" y="54" fill="#F1E3D3" font-family="monospace" font-size="10">Cosine Sim: </text>
    <text x="110" y="54" fill="#D4A373" font-family="monospace" font-size="10" font-weight="bold">0.9421 (BGE)</text>

    <rect x="20" y="70" width="170" height="24" rx="6" fill="#15281E" stroke="#D4A373" stroke-width="0.8" />
    <text x="28" y="86" fill="#F1E3D3" font-family="monospace" font-size="10">Qdrant Hits: </text>
    <text x="110" y="86" fill="#D4A373" font-family="monospace" font-size="10" font-weight="bold">Top 5 Chunks</text>

    <rect x="20" y="102" width="170" height="24" rx="6" fill="#15281E" stroke="#D4A373" stroke-width="0.8" />
    <text x="28" y="118" fill="#F1E3D3" font-family="monospace" font-size="10">Gemini LLM: </text>
    <text x="110" y="118" fill="#D4A373" font-family="monospace" font-size="10" font-weight="bold">Zero Hallucination</text>

    <!-- Verified Badge -->
    <rect x="20" y="133" width="90" height="16" rx="4" fill="#D4A373" />
    <text x="28" y="145" fill="#1F3B2C" font-family="sans-serif" font-size="9" font-weight="bold">✓ VERIFIED CITATION</text>
  </g>

  <!-- Connecting Circuit Traces from mascot to panels -->
  <path d="M 270 155 Q 340 180 340 220" fill="none" stroke="#D4A373" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.6" />
  <path d="M 460 250 Q 490 280 530 290" fill="none" stroke="#D4A373" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Center Master Mascot Composition -->
  <g transform="translate(400, 225)">
    <!-- Mascot Orbit Rings -->
    <circle cx="0" cy="-10" r="110" fill="none" stroke="#D4A373" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.7" />
    <circle cx="0" cy="-10" r="85" fill="none" stroke="#F1E3D3" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />

    <!-- Orbital Badges -->
    <!-- Top Brain Badge -->
    <circle cx="0" cy="-120" r="14" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.2" />
    <circle cx="0" cy="-120" r="4" fill="#D4A373" />

    <!-- Right Git Branch Badge -->
    <circle cx="104" cy="-55" r="13" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.2" />
    <circle cx="100" cy="-52" r="2.5" fill="#D4A373" />
    <circle cx="108" cy="-59" r="2.5" fill="#D4A373" />
    <path d="M 100 -52 L 108 -59" stroke="#D4A373" stroke-width="1.5" />

    <!-- Left Semantic Search Badge -->
    <circle cx="-104" cy="-55" r="13" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.2" />
    <circle cx="-105" cy="-57" r="3.5" fill="none" stroke="#D4A373" stroke-width="1.8" />
    <path d="M -102 -54 L -99 -51" stroke="#D4A373" stroke-width="2" />

    <!-- Bottom Left AST Badge -->
    <circle cx="-85" cy="50" r="12" fill="#1F3B2C" stroke="#D4A373" stroke-width="2" />
    <text x="-90" y="54" fill="#D4A373" font-family="monospace" font-size="11" font-weight="bold">{ }</text>

    <!-- Bottom Right Vector DB Badge -->
    <circle cx="85" cy="50" r="12" fill="#1F3B2C" stroke="#D4A373" stroke-width="2" />
    <ellipse cx="85" cy="48" rx="5" ry="2" fill="none" stroke="#D4A373" stroke-width="1.2" />
    <ellipse cx="85" cy="53" rx="5" ry="2" fill="none" stroke="#D4A373" stroke-width="1.2" />

    <!-- Robot-Cat Mascot Silhouette -->
    <!-- Cat Ears -->
    <polygon points="-42,-65 -22,-100 -10,-65" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="-35,-68 -22,-90 -16,-68" fill="#D4A373" opacity="0.85" />

    <polygon points="10,-65 22,-100 42,-65" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="16,-68 22,-90 35,-68" fill="#D4A373" opacity="0.85" />

    <!-- Antenna Stem & Glowing Orb -->
    <line x1="0" y1="-75" x2="0" y2="-98" stroke="#D4A373" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-101" r="6" fill="#F1E3D3" stroke="#D4A373" stroke-width="2" />
    <circle cx="0" cy="-101" r="2" fill="#1F3B2C" />

    <!-- Head Chassis -->
    <rect x="-48" y="-70" width="96" height="74" rx="28" fill="#1F3B2C" stroke="#D4A373" stroke-width="3" />

    <!-- Silk Beige Face Visor Plate -->
    <rect x="-38" y="-58" width="76" height="50" rx="18" fill="#F1E3D3" stroke="#1F3B2C" stroke-width="1.5" />

    <!-- Expressive Eyes -->
    <circle cx="-18" cy="-35" r="7.5" fill="#1F3B2C" />
    <circle cx="-16" cy="-37" r="2.5" fill="#D4A373" />
    <circle cx="-20" cy="-33" r="1.2" fill="#FFFFFF" />

    <circle cx="18" cy="-35" r="7.5" fill="#1F3B2C" />
    <circle cx="16" cy="-37" r="2.5" fill="#D4A373" />
    <circle cx="20" cy="-33" r="1.2" fill="#FFFFFF" />

    <!-- Tech Cheek Whiskers -->
    <line x1="-34" y1="-32" x2="-28" y2="-32" stroke="#D4A373" stroke-width="2" stroke-linecap="round" />
    <line x1="-34" y1="-26" x2="-29" y2="-25" stroke="#D4A373" stroke-width="2" stroke-linecap="round" />
    <line x1="28" y1="-32" x2="34" y2="-32" stroke="#D4A373" stroke-width="2" stroke-linecap="round" />
    <line x1="29" y1="-25" x2="34" y2="-26" stroke="#D4A373" stroke-width="2" stroke-linecap="round" />

    <!-- Friendly Nose & Smile -->
    <polygon points="0,-27 -3,-24 3,-24" fill="#D4A373" />
    <path d="M -5 -21 Q 0 -17 5 -21" fill="none" stroke="#1F3B2C" stroke-width="2" stroke-linecap="round" />

    <!-- Torso Chassis -->
    <path d="M -36 10 C -42 22, -44 56, -42 70 L 42 70 C 44 56, 42 22, 36 10 Z" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.5" />

    <!-- Laptop Computer with Programming Symbol -->
    <g transform="translate(0, 36)">
      <!-- Laptop Screen Shell -->
      <rect x="-38" y="-12" width="76" height="42" rx="6" fill="#15281E" stroke="#D4A373" stroke-width="2.2" />
      <rect x="-34" y="-8" width="68" height="34" rx="4" fill="#0E1A14" />
      <!-- Glowing </> Code Symbol -->
      <text x="0" y="16" fill="#D4A373" font-family="monospace" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1.5">&lt; / &gt;</text>
      <!-- Laptop Base -->
      <path d="M -44 32 L 44 32 L 36 39 L -36 39 Z" fill="#D4A373" stroke="#1F3B2C" stroke-width="1.5" />
      <rect x="-10" y="33" width="20" height="2" rx="1" fill="#1F3B2C" />
      <!-- Paws Holding Laptop -->
      <circle cx="-32" cy="30" r="6" fill="#F1E3D3" stroke="#1F3B2C" stroke-width="1.8" />
      <circle cx="32" cy="30" r="6" fill="#F1E3D3" stroke="#1F3B2C" stroke-width="1.8" />
    </g>
  </g>

  <!-- Title Pill at Bottom -->
  <g transform="translate(400, 412)">
    <rect x="-160" y="-16" width="320" height="30" rx="15" fill="#1F3B2C" stroke="#D4A373" stroke-width="1.5" />
    <text x="0" y="4" fill="#F1E3D3" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      CodeRAG AI Coding Mascot • <tspan fill="#D4A373">Grounded Intelligence</tspan>
    </text>
  </g>
</svg>
