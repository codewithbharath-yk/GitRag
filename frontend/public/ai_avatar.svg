<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#284E3B" />
      <stop offset="100%" stop-color="#15281E" />
    </linearGradient>
    <linearGradient id="aiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8BE92" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle (Emerald Night) -->
  <circle cx="60" cy="60" r="58" fill="url(#aiBg)" stroke="#D4A373" stroke-width="2" />

  <!-- Outer Orbit Ring with dashed tech ticks -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#D4A373" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75" />

  <!-- Inner Pulse Ring -->
  <circle cx="60" cy="60" r="38" fill="#1F3B2C" stroke="#D4A373" stroke-width="2" />

  <!-- Hexagon Core / Brain Platform -->
  <polygon points="60,32 78,42 78,66 60,76 42,66 42,42" fill="url(#aiGold)" stroke="#1F3B2C" stroke-width="1.5" filter="url(#aiGlow)" />

  <!-- Cybernetic Sensors -->
  <circle cx="53" cy="52" r="3.5" fill="#1F3B2C" />
  <circle cx="67" cy="52" r="3.5" fill="#1F3B2C" />
  <circle cx="53" cy="52" r="1.5" fill="#F1E3D3" />
  <circle cx="67" cy="52" r="1.5" fill="#F1E3D3" />

  <!-- Smile Circuit -->
  <path d="M52 61 Q60 66 68 61" fill="none" stroke="#1F3B2C" stroke-width="2" stroke-linecap="round" />

  <!-- Satellite Energy Orbs in Antique Gold & Silk Beige -->
  <circle cx="60" cy="22" r="3" fill="#D4A373" />
  <circle cx="98" cy="60" r="3" fill="#F1E3D3" />
  <circle cx="60" cy="98" r="3" fill="#D4A373" />
  <circle cx="22" cy="60" r="3" fill="#F1E3D3" />

  <!-- Code Bracket Accents < > -->
  <path d="M28 48 L22 54 L28 60" fill="none" stroke="#F1E3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M92 48 L98 54 L92 60" fill="none" stroke="#F1E3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>
