<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2D2A" />
      <stop offset="100%" stop-color="#0E1917" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6DBE9B" />
      <stop offset="50%" stop-color="#34686C" />
      <stop offset="100%" stop-color="#295255" />
    </linearGradient>
    <linearGradient id="whiteGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F5F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#aiBg)" stroke="#577877" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Outer Orbit Ring with dashed tech ticks -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#6DBE9B" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.6" />

  <!-- Inner Pulse Ring -->
  <circle cx="60" cy="60" r="38" fill="#162623" stroke="#295255" stroke-width="3" />

  <!-- Hexagon Core / Brain Platform -->
  <polygon points="60,32 78,42 78,66 60,76 42,66 42,42" fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glow)" opacity="0.95" />

  <!-- Cybernetic Eyes / Optical Sensors -->
  <circle cx="53" cy="52" r="3.5" fill="#FFFFFF" />
  <circle cx="67" cy="52" r="3.5" fill="#FFFFFF" />
  <circle cx="53" cy="52" r="1.5" fill="#162623" />
  <circle cx="67" cy="52" r="1.5" fill="#162623" />

  <!-- Neural Synapse Line / Smile Circuit -->
  <path d="M52 61 Q60 66 68 61" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Satellite Energy Orbs -->
  <circle cx="60" cy="22" r="3" fill="#6DBE9B" />
  <circle cx="98" cy="60" r="3" fill="#FFFFFF" />
  <circle cx="60" cy="98" r="3" fill="#6DBE9B" />
  <circle cx="22" cy="60" r="3" fill="#FFFFFF" />

  <!-- Code Bracket Accents < > -->
  <path d="M28 48 L22 54 L28 60" fill="none" stroke="#F0F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
  <path d="M92 48 L98 54 L92 60" fill="none" stroke="#F0F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
</svg>
