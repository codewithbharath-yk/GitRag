<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="userBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243D39" />
      <stop offset="100%" stop-color="#162623" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34686C" />
      <stop offset="100%" stop-color="#295255" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEADE" />
      <stop offset="100%" stop-color="#E7C5B0" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#userBg)" stroke="#577877" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Developer Hoodie Shoulders -->
  <path d="M22 108 C25 86 42 78 60 78 C78 78 95 86 98 108 Z" fill="url(#hoodieGrad)" stroke="#577877" stroke-width="1.5" />

  <!-- Hoodie Zipper / Collar Accent -->
  <path d="M60 88 L60 108" stroke="#F0F5F7" stroke-width="2" stroke-linecap="round" />
  <path d="M54 79 L60 88 L66 79" fill="none" stroke="#F0F5F7" stroke-width="2" />

  <!-- Neck -->
  <rect x="53" y="66" width="14" height="15" rx="3" fill="#E7C5B0" />

  <!-- Head / Face -->
  <ellipse cx="60" cy="52" rx="20" ry="24" fill="url(#faceGrad)" />

  <!-- Modern Hair -->
  <path d="M39 48 C38 34 50 24 62 24 C74 24 82 32 81 44 C77 38 70 34 60 34 C50 34 44 42 39 48 Z" fill="#1B2D2A" />

  <!-- Eyeglasses / Frame for Developer Look -->
  <rect x="44" y="46" width="13" height="9" rx="2.5" fill="none" stroke="#162623" stroke-width="2" />
  <rect x="63" y="46" width="13" height="9" rx="2.5" fill="none" stroke="#162623" stroke-width="2" />
  <line x1="57" y1="50" x2="63" y2="50" stroke="#162623" stroke-width="2" />

  <!-- Eyes behind glasses -->
  <circle cx="50.5" cy="50.5" r="1.5" fill="#162623" />
  <circle cx="69.5" cy="50.5" r="1.5" fill="#162623" />

  <!-- Friendly Smile -->
  <path d="M54 62 Q60 66 66 62" fill="none" stroke="#7A5648" stroke-width="2" stroke-linecap="round" />

  <!-- Headphones / Over-ear audio headset -->
  <path d="M37 54 C35 34 44 22 60 22 C76 22 85 34 83 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <rect x="34" y="46" width="6" height="16" rx="3" fill="#6DBE9B" stroke="#FFFFFF" stroke-width="1.5" />
  <rect x="80" y="46" width="6" height="16" rx="3" fill="#6DBE9B" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Active Status Indicator Dot -->
  <circle cx="95" cy="95" r="8" fill="#162623" />
  <circle cx="95" cy="95" r="5" fill="#6DBE9B" />
</svg>
