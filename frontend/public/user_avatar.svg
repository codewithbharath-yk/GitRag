<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="uBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#284E3B" />
      <stop offset="100%" stop-color="#15281E" />
    </linearGradient>
    <linearGradient id="uHoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3B2C" />
      <stop offset="100%" stop-color="#15281E" />
    </linearGradient>
    <linearGradient id="uFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EE" />
      <stop offset="100%" stop-color="#F1E3D3" />
    </linearGradient>
  </defs>

  <!-- Background Circle (Emerald Night) -->
  <circle cx="60" cy="60" r="58" fill="url(#uBg)" stroke="#D4A373" stroke-width="2" />

  <!-- Developer Hoodie Shoulders -->
  <path d="M22 108 C25 86 42 78 60 78 C78 78 95 86 98 108 Z" fill="url(#uHoodie)" stroke="#D4A373" stroke-width="1.5" />

  <!-- Hoodie Zipper / Collar Accent -->
  <path d="M60 88 L60 108" stroke="#D4A373" stroke-width="2" stroke-linecap="round" />
  <path d="M54 79 L60 88 L66 79" fill="none" stroke="#D4A373" stroke-width="2" />

  <!-- Neck -->
  <rect x="53" y="66" width="14" height="15" rx="3" fill="#F1E3D3" />

  <!-- Head / Face -->
  <ellipse cx="60" cy="52" rx="20" ry="24" fill="url(#uFace)" />

  <!-- Modern Hair (Emerald Night) -->
  <path d="M39 48 C38 34 50 24 62 24 C74 24 82 32 81 44 C77 38 70 34 60 34 C50 34 44 42 39 48 Z" fill="#15281E" />

  <!-- Eyeglasses / Frame in Antique Gold -->
  <rect x="44" y="46" width="13" height="9" rx="2.5" fill="none" stroke="#D4A373" stroke-width="2" />
  <rect x="63" y="46" width="13" height="9" rx="2.5" fill="none" stroke="#D4A373" stroke-width="2" />
  <line x1="57" y1="50" x2="63" y2="50" stroke="#D4A373" stroke-width="2" />

  <!-- Eyes behind glasses -->
  <circle cx="50.5" cy="50.5" r="1.5" fill="#1F3B2C" />
  <circle cx="69.5" cy="50.5" r="1.5" fill="#1F3B2C" />

  <!-- Friendly Smile -->
  <path d="M54 62 Q60 66 66 62" fill="none" stroke="#1F3B2C" stroke-width="2" stroke-linecap="round" />

  <!-- Headphones / Over-ear audio headset -->
  <path d="M37 54 C35 34 44 22 60 22 C76 22 85 34 83 54" fill="none" stroke="#D4A373" stroke-width="3" stroke-linecap="round" />
  <rect x="34" y="46" width="6" height="16" rx="3" fill="#1F3B2C" stroke="#D4A373" stroke-width="1.5" />
  <rect x="80" y="46" width="6" height="16" rx="3" fill="#1F3B2C" stroke="#D4A373" stroke-width="1.5" />

  <!-- Active Status Indicator Dot (Antique Gold) -->
  <circle cx="95" cy="95" r="8" fill="#15281E" />
  <circle cx="95" cy="95" r="5" fill="#D4A373" />
</svg>
