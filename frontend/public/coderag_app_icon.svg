<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <radialGradient id="appGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#1F3B2C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#15281E" />
    </radialGradient>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#284E3B" />
      <stop offset="100%" stop-color="#15281E" />
    </linearGradient>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="192" height="192" rx="42" fill="url(#appBg)" stroke="#D4A373" stroke-width="2.5" />
  <rect x="4" y="4" width="184" height="184" rx="38" fill="url(#appGlow)" />

  <!-- Orbit Ring -->
  <circle cx="96" cy="88" r="62" fill="none" stroke="#D4A373" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.6" />

  <!-- Cat Ears -->
  <path d="M68 70 L56 42 C67 45 78 54 80 64 Z" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M64 58 L60 48 C65 50 71 54 72 60 Z" fill="#D4A373" opacity="0.85" />
  <path d="M124 70 L136 42 C125 45 114 54 112 64 Z" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M128 58 L132 48 C127 50 121 54 120 60 Z" fill="#D4A373" opacity="0.85" />

  <!-- Head -->
  <ellipse cx="96" cy="82" rx="36" ry="30" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.5" />
  <!-- Faceplate -->
  <ellipse cx="96" cy="84" rx="25" ry="18" fill="#F1E3D3" stroke="#1F3B2C" stroke-width="1.2" />

  <!-- Cheerful Eyes -->
  <path d="M83 82 Q89 74 95 82" fill="none" stroke="#1F3B2C" stroke-width="2.8" stroke-linecap="round" />
  <path d="M97 82 Q103 74 109 82" fill="none" stroke="#1F3B2C" stroke-width="2.8" stroke-linecap="round" />

  <!-- Antenna -->
  <path d="M112 56 L123 38" stroke="#D4A373" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="125" cy="36" r="4" fill="#D4A373" stroke="#F1E3D3" stroke-width="1.5" />

  <!-- Laptop with Code -->
  <path d="M80 112 L132 112 L120 144 L70 144 Z" fill="#15281E" stroke="#D4A373" stroke-width="2.2" stroke-linejoin="round" />
  <polygon points="82,114 130,114 118,141 74,141" fill="#1F3B2C" />
  <path d="M90 126 L85 130 L90 134" fill="none" stroke="#F1E3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="99" y1="124" x2="95" y2="136" stroke="#D4A373" stroke-width="2" stroke-linecap="round" />
  <path d="M103 126 L108 130 L103 134" fill="none" stroke="#F1E3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Paws -->
  <ellipse cx="76" cy="126" rx="5" ry="4" fill="#284E3B" stroke="#D4A373" stroke-width="1.5" />
  <ellipse cx="122" cy="126" rx="5" ry="4" fill="#284E3B" stroke="#D4A373" stroke-width="1.5" />
</svg>
