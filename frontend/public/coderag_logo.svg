<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6DBE9B" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#295255" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#162623" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3430" />
      <stop offset="50%" stop-color="#162623" />
      <stop offset="100%" stop-color="#111E1C" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6DBE9B" />
      <stop offset="100%" stop-color="#295255" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="92" fill="url(#haloGlow)" />

  <!-- Outer Hologram Ring -->
  <circle cx="100" cy="85" r="70" fill="none" stroke="#295255" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
  <circle cx="100" cy="85" r="58" fill="none" stroke="#6DBE9B" stroke-width="1.5" opacity="0.6" />

  <!-- Orbital Node Icons -->
  <!-- Top Node: AI Brain -->
  <circle cx="100" cy="20" r="10" fill="#162623" stroke="#6DBE9B" stroke-width="2" />
  <path d="M96 20 C96 17 104 17 104 20 C104 22 96 22 96 20 Z" fill="#6DBE9B" />
  
  <!-- Right Node: Git Branch -->
  <circle cx="166" cy="65" r="9" fill="#162623" stroke="#6DBE9B" stroke-width="2" />
  <circle cx="163" cy="68" r="2" fill="#6DBE9B" />
  <circle cx="168" cy="62" r="2" fill="#6DBE9B" />
  <path d="M163 68 L168 62" stroke="#6DBE9B" stroke-width="1.5" />

  <!-- Left Node: Search -->
  <circle cx="34" cy="65" r="9" fill="#162623" stroke="#6DBE9B" stroke-width="2" />
  <circle cx="33" cy="63" r="3" fill="none" stroke="#6DBE9B" stroke-width="1.5" />
  <path d="M36 66 L38 68" stroke="#6DBE9B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Bottom Left: Code File -->
  <circle cx="42" cy="120" r="8" fill="#162623" stroke="#577877" stroke-width="1.5" />
  <path d="M40 120 L38 120 M44 120 L42 120" stroke="#6DBE9B" stroke-width="1.5" />

  <!-- Bottom Right: Vector DB -->
  <circle cx="158" cy="120" r="8" fill="#162623" stroke="#577877" stroke-width="1.5" />
  <ellipse cx="158" cy="118" rx="4" ry="2" fill="none" stroke="#6DBE9B" stroke-width="1.2" />
  <ellipse cx="158" cy="122" rx="4" ry="2" fill="none" stroke="#6DBE9B" stroke-width="1.2" />

  <!-- Mascot Body & Silhouette -->
  <!-- Cat Ears -->
  <path d="M68 68 L58 42 C68 45 78 54 80 62 Z" fill="#111E1C" stroke="#6DBE9B" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M132 68 L142 42 C132 45 122 54 120 62 Z" fill="#111E1C" stroke="#6DBE9B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Head -->
  <ellipse cx="100" cy="80" rx="38" ry="32" fill="url(#bodyGrad)" stroke="#6DBE9B" stroke-width="3" filter="url(#softGlow)" />

  <!-- Cat Cheerful Eyes (Happy Archs) -->
  <path d="M84 78 Q90 70 96 78" fill="none" stroke="#6DBE9B" stroke-width="3" stroke-linecap="round" />
  <path d="M104 78 Q110 70 116 78" fill="none" stroke="#6DBE9B" stroke-width="3" stroke-linecap="round" />

  <!-- Antenna with Glowing Orb -->
  <path d="M116 54 L126 38" stroke="#6DBE9B" stroke-width="2" stroke-linecap="round" />
  <circle cx="128" cy="36" r="3.5" fill="#F0F5F7" stroke="#6DBE9B" stroke-width="1.5" />

  <!-- Body -->
  <path d="M82 108 C80 120 74 135 70 144 C82 146 118 146 130 144 C126 135 120 120 118 108 Z" fill="#111E1C" stroke="#295255" stroke-width="2" />
  
  <!-- Curled Tail -->
  <path d="M72 136 C60 134 54 120 56 112 C58 108 62 108 62 112 C60 118 64 126 72 128 Z" fill="#111E1C" stroke="#6DBE9B" stroke-width="2" stroke-linejoin="round" />

  <!-- Glowing Laptop with Code Brackets -->
  <path d="M86 114 L134 114 L124 146 L76 146 Z" fill="#162623" stroke="#6DBE9B" stroke-width="2.5" stroke-linejoin="round" filter="url(#softGlow)" />
  <path d="M96 130 L90 134 L96 138" fill="none" stroke="#F0F5F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M104 128 L100 140" fill="none" stroke="#6DBE9B" stroke-width="2" stroke-linecap="round" />
  <path d="M108 130 L114 134 L108 138" fill="none" stroke="#F0F5F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Paws on Laptop -->
  <ellipse cx="80" cy="128" rx="5" ry="4" fill="#1B2D2A" stroke="#6DBE9B" stroke-width="1.5" />
  <ellipse cx="128" cy="128" rx="5" ry="4" fill="#1B2D2A" stroke="#6DBE9B" stroke-width="1.5" />
</svg>
