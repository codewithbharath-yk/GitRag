<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Ambient Halo Glow in Antique Gold & Emerald Night -->
    <radialGradient id="crHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#1F3B2C" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1F3B2C" stop-opacity="0" />
    </radialGradient>
    
    <!-- Body Gradient: Emerald Night -->
    <linearGradient id="crBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#284E3B" />
      <stop offset="50%" stop-color="#1F3B2C" />
      <stop offset="100%" stop-color="#15281E" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="crGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8BE92" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>

    <!-- Face Plate Gradient: Silk Beige -->
    <linearGradient id="crFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EE" />
      <stop offset="100%" stop-color="#F1E3D3" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="crGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="92" fill="url(#crHalo)" />

  <!-- Outer Hologram Orbit Rings -->
  <circle cx="100" cy="85" r="70" fill="none" stroke="#D4A373" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="100" cy="85" r="56" fill="none" stroke="#1F3B2C" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Orbital Knowledge Badges -->
  <!-- Top Node: AI Brain -->
  <circle cx="100" cy="18" r="9" fill="#1F3B2C" stroke="#D4A373" stroke-width="1.8" />
  <path d="M96 18 C96 15 104 15 104 18 C104 20 96 20 96 18 Z" fill="#D4A373" />
  <circle cx="100" cy="18" r="1.5" fill="#F1E3D3" />

  <!-- Top Right Node: Git Branch -->
  <circle cx="166" cy="62" r="9" fill="#1F3B2C" stroke="#D4A373" stroke-width="1.8" />
  <circle cx="163" cy="65" r="2" fill="#D4A373" />
  <circle cx="169" cy="59" r="2" fill="#D4A373" />
  <path d="M163 65 L169 59" stroke="#D4A373" stroke-width="1.5" />

  <!-- Top Left Node: Semantic Search -->
  <circle cx="34" cy="62" r="9" fill="#1F3B2C" stroke="#D4A373" stroke-width="1.8" />
  <circle cx="33" cy="60" r="3" fill="none" stroke="#D4A373" stroke-width="1.5" />
  <path d="M35 63 L38 66" stroke="#D4A373" stroke-width="1.5" stroke-linecap="round" />

  <!-- Bottom Left: Code File -->
  <circle cx="40" cy="122" r="8" fill="#1F3B2C" stroke="#D4A373" stroke-width="1.5" opacity="0.9" />
  <path d="M37 122 L43 122 M37 125 L41 125" stroke="#F1E3D3" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bottom Right: Vector Qdrant DB -->
  <circle cx="160" cy="122" r="8" fill="#1F3B2C" stroke="#D4A373" stroke-width="1.5" opacity="0.9" />
  <ellipse cx="160" cy="120" rx="4" ry="1.8" fill="none" stroke="#D4A373" stroke-width="1.2" />
  <ellipse cx="160" cy="124" rx="4" ry="1.8" fill="none" stroke="#D4A373" stroke-width="1.2" />

  <!-- Robot Mascot Ears -->
  <path d="M68 68 L56 40 C67 43 78 52 80 62 Z" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M64 56 L60 46 C65 48 71 52 72 58 Z" fill="#D4A373" opacity="0.8" />
  <path d="M132 68 L144 40 C133 43 122 52 120 62 Z" fill="#1F3B2C" stroke="#D4A373" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M136 56 L140 46 C135 48 129 52 128 58 Z" fill="#D4A373" opacity="0.8" />

  <!-- Mascot Head (Emerald Night Outer Shell) -->
  <ellipse cx="100" cy="80" rx="38" ry="32" fill="url(#crBody)" stroke="#D4A373" stroke-width="2.5" filter="url(#crGlow)" />

  <!-- Mascot Faceplate (Silk Beige) -->
  <ellipse cx="100" cy="82" rx="27" ry="20" fill="url(#crFace)" stroke="#1F3B2C" stroke-width="1.5" />

  <!-- Cheerful Cat Eyes (Emerald Night Happy Arcs) -->
  <path d="M86 80 Q92 72 98 80" fill="none" stroke="#1F3B2C" stroke-width="3" stroke-linecap="round" />
  <path d="M102 80 Q108 72 114 80" fill="none" stroke="#1F3B2C" stroke-width="3" stroke-linecap="round" />

  <!-- Cute Cat Nose & Smile -->
  <polygon points="100,85 98,83 102,83" fill="#D4A373" />
  <path d="M97 86 Q100 89 103 86" fill="none" stroke="#1F3B2C" stroke-width="1.5" stroke-linecap="round" />

  <!-- Whiskers -->
  <line x1="75" y1="81" x2="68" y2="80" stroke="#D4A373" stroke-width="1.5" stroke-linecap="round" />
  <line x1="75" y1="84" x2="69" y2="86" stroke="#D4A373" stroke-width="1.5" stroke-linecap="round" />
  <line x1="125" y1="81" x2="132" y2="80" stroke="#D4A373" stroke-width="1.5" stroke-linecap="round" />
  <line x1="125" y1="84" x2="131" y2="86" stroke="#D4A373" stroke-width="1.5" stroke-linecap="round" />

  <!-- AI Connection Antenna with Glowing Gold Orb -->
  <path d="M116 54 L127 36" stroke="#D4A373" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="129" cy="34" r="4.5" fill="url(#crGold)" stroke="#1F3B2C" stroke-width="1.5" />
  <circle cx="129" cy="34" r="1.8" fill="#F1E3D3" />

  <!-- Mascot Body -->
  <path d="M82 108 C80 120 74 135 70 144 C82 146 118 146 130 144 C126 135 120 120 118 108 Z" fill="url(#crBody)" stroke="#D4A373" stroke-width="2" />
  
  <!-- Curled Cat Tail -->
  <path d="M72 136 C58 134 52 120 54 112 C56 108 60 108 60 112 C58 118 62 126 72 128 Z" fill="#1F3B2C" stroke="#D4A373" stroke-width="2" stroke-linejoin="round" />

  <!-- Glowing Laptop with Code Brackets </> -->
  <!-- Laptop Base & Screen -->
  <path d="M84 114 L136 114 L124 146 L74 146 Z" fill="#15281E" stroke="#D4A373" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Screen Inset -->
  <polygon points="86,116 134,116 122,143 78,143" fill="#1F3B2C" />
  
  <!-- Code Brackets < / > in Silk Beige & Antique Gold -->
  <path d="M94 128 L88 132 L94 136" fill="none" stroke="#F1E3D3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="103" y1="126" x2="99" y2="138" stroke="#D4A373" stroke-width="2.2" stroke-linecap="round" />
  <path d="M107 128 L113 132 L107 136" fill="none" stroke="#F1E3D3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Paws on Laptop (Emerald Night with Gold outline) -->
  <ellipse cx="80" cy="128" rx="5" ry="4" fill="#284E3B" stroke="#D4A373" stroke-width="1.5" />
  <ellipse cx="126" cy="128" rx="5" ry="4" fill="#284E3B" stroke="#D4A373" stroke-width="1.5" />
</svg>
